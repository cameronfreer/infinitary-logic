name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Pure CI: build + checks only (~5 min). The site (API docs, blueprint web/PDF,
# homepage, Pages deploy) is built by docs.yml — weekly cron or manual dispatch
# (gh workflow run docs.yml) — since doc-gen4 alone takes ~21 min per run.
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build project and run checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lean project and blueprint data
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e
        with:
          build: true
          build-args: "InfinitaryLogic InfinitaryLogic.Everything :blueprint :blueprintJson InfinitaryLogicWIP"
          use-github-cache: true
          use-mathlib-cache: true

      - name: Verify docbuild resolves the same toolchain and Mathlib as the root
        run: python3 scripts/check_docbuild_sync.py

      - name: Verify sorry boundary
        run: python3 scripts/check_sorry_boundary.py

      - name: Verify local EMContext import boundary
        run: bash scripts/check_local_boundary.sh

      - name: Check blueprint declarations
        run: lake exe checkdecls blueprint/lean_decls

      - name: Verify headline declarations (default-import smoke + standard axioms)
        run: bash scripts/check_headline_axioms.sh

      - name: Verify morley_hanf dependency cone (bounded ER yes, infinite Ramsey / legacy ladder no)
        run: lake env lean scripts/check_morley_hanf_deps.lean

      - name: "Verify #8 truth-lemma cone (Henkin closure yes, maximal consistency no)"
        run: lake env lean scripts/check_truth_lemma_cone.lean

      - name: Verify honest HF fragment (Mathlib compactness yes, legacy fragment structures no)
        run: lake env lean scripts/check_hf_compactness.lean

      - name: Verify coded-fragment interface is on the default import surface
        run: lake env lean scripts/check_admissible_surface.lean

      - name: "Verify #18 proof-system boundary (no legacy fragment structures in the Derivable/soundness cone)"
        run: lake env lean scripts/check_proof_system_boundary.lean
