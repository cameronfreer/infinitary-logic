name: Build and Deploy Site

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages (set false for cache experiments)"
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * 0'  # weekly, Sunday 6am UTC

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

# The full site pipeline (API docs via doc-gen4, blueprint web + PDF, homepage,
# GitHub Pages deploy). Kept off the push path because API generation dominates the
# run time; runs on manual dispatch (`gh workflow run docs.yml`) and a weekly cron.
jobs:
  docs:
    runs-on: ubuntu-latest
    name: Build and deploy API docs + blueprint + homepage
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      # Root build cache: only the project's own oleans (.lake/build, ~350 MB), not the whole
      # .lake that lean-action's GitHub cache stored (~2.7 GB per ref, including Mathlib, which
      # the Mathlib cache already serves). Key: OS, arch, toolchain and manifest, plus the exact
      # commit; the fallback drops the commit, so a new commit restores the most recently created
      # compatible cache visible in its scope (default-branch caches are readable by branches).
      # This workflow only restores; master CI writes. The build command stays
      # unconditional: the cache supplies prior state, Lake decides freshness. Bump the version
      # segment if the cached path or its layout changes.
      - name: Restore root build cache
        id: root-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build Lean project and blueprint
        uses: leanprover/lean-action@c544e89643240c6b398f14a431bcdc6309e36b3e
        with:
          build: true
          build-args: "InfinitaryLogic :blueprint :blueprintJson InfinitaryLogicWIP"
          use-github-cache: false
          use-mathlib-cache: true

      # doc-gen4's incremental state lives in docbuild/.lake (separate from the root .lake/build
      # restored above). Restore it before generation and save it immediately after
      # successful generation, so a later TeX failure cannot discard a valid cache. The build
      # command stays unconditional: the cache supplies prior state, Lake decides freshness.
      # Key: OS, arch, toolchain, both manifests and the doc-gen4 pin, plus the exact commit;
      # the fallback drops only the commit, so a new commit restores the most recently created
      # matching cache visible in the current cache scope. Eviction is by last access, not
      # size; keep the root build cache small so this one is not crowded out. A future change to the cached path,
      # doc-gen4 layout, or any untraced documentation input should add a version to the prefix.
      - name: Restore docbuild cache
        id: docbuild-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: docbuild/.lake/build
          key: docbuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            docbuild-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'docbuild/lake-manifest.json', 'docbuild/lakefile.toml') }}-

      # The restored cache carries doc-gen4's HTML-generation marker (`doc-data/*.docs_built`)
      # from an OLDER commit. Lake replays the final `:docs` job against that marker even after
      # rebuilding the per-module docInfo rows, so the deployed HTML was the cached commit's
      # (observed 2026-09-07: run 34160938501 rebuilt two new modules' docInfo, replayed `:docs`,
      # and deployed v5.0.0's pages, retired module included). Remove only the rendered output,
      # the manifest, and the HTML-generation markers; the per-module docInfo markers
      # (`doc-data/*.doc`, including dependencies and core) and the database stay cached, so the
      # incremental extraction is reused and only `fromDb` (under a minute) reruns.
      #
      # The documented inventory is the import closure of `InfinitaryLogic.Everything`: the
      # default surface, the Conditional bundle, and the legacy off-path modules that CI builds.
      # `InfinitaryLogic:docs` would document only the default root's closure.
      - name: Build API docs
        run: |
          cd docbuild
          rm -rf .lake/build/doc .lake/build/doc-manifest.json
          rm -f .lake/build/doc-data/*.docs_built .lake/build/doc-data/*.docs_built.trace
          lake build InfinitaryLogic.Everything:docs

      # Evidence, not trust: every module of the inventory has a page, no page survives its
      # module, named recent declarations are present as anchors (an old copy of an existing
      # page cannot pass), and retired pages are absent. The self-test first proves the checker
      # fails on a missing page, a missing anchor, and a present retired page.
      - name: Check API docs are complete and current
        run: |
          python3 scripts/api_docs_coverage.py --self-test
          python3 scripts/api_docs_coverage.py docbuild/.lake/build/doc

      - name: Save docbuild cache
        if: steps.docbuild-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: docbuild/.lake/build
          key: ${{ steps.docbuild-cache-restore.outputs.cache-primary-key }}

      - name: Install blueprint dependencies (cached apt)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: graphviz libgraphviz-dev texlive-binaries texlive-bibtex-extra texlive-latex-extra texlive-xetex texlive-fonts-recommended texlive-fonts-extra latexmk
          # bumped 1.1 -> 1.2 on 2026-07-22: a restored 1.1 cache lacked the bibtex binary
          # (two consecutive failures), so force a fresh cache build
          # bumped 1.2 -> 1.3 on 2026-09-03: the 1.2 cache was evicted, the fresh install hit
          # apt mirror fetch errors, and the action saved the broken (5 KB) result under the
          # 1.2 key, so every later run restored a payload without xelatex
          version: 1.3

      # The cached restore has delivered incomplete texlive payloads before (missing bibtex
      # despite a cache hit) - verify the binaries the pipeline actually invokes, and fall
      # back to a real install if any are absent.
      - name: Verify TeX binaries (post-cache check)
        run: |
          command -v bibtex && command -v pdflatex && command -v xelatex && command -v latexmk || {
            echo "cached apt restore incomplete - installing directly"
            sudo apt-get update
            sudo apt-get install -y texlive-binaries texlive-bibtex-extra texlive-latex-extra \
              texlive-xetex texlive-fonts-recommended latexmk
          }

      - name: Install leanblueprint
        run: pip install leanblueprint

      - name: Generate bibliography for web
        run: |
          cd blueprint/src
          pdflatex -interaction=nonstopmode print.tex || true
          bibtex print
          cp print.bbl web.bbl

      - name: Build blueprint website
        run: leanblueprint web

      # lean_decls is committed so the fast per-push CI can run checkdecls without
      # a blueprint build; the web build above regenerates it, so fail here if the
      # committed snapshot has drifted from the blueprint sources.
      - name: Check lean_decls freshness and declarations
        run: |
          git diff --exit-code blueprint/lean_decls
          lake exe checkdecls blueprint/lean_decls

      - name: Build blueprint PDF
        run: leanblueprint pdf

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: home_page

      - name: Build homepage
        run: |
          cd home_page
          # Stamp the exact commit this deployment was built from, so the live page can be
          # checked against the run's captured headSha without inferring it from content.
          printf '\ndeployed_sha: "%s"\n' "$GITHUB_SHA" >> _config.yml
          bundle exec jekyll build --baseurl "/infinitary-logic" --destination ../_site

      - name: Assemble site
        run: |
          mkdir -p _site/blueprint
          cp -r blueprint/web/* _site/blueprint/
          cp blueprint/print/print.pdf _site/blueprint/blueprint.pdf
          cp -r docbuild/.lake/build/doc _site/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: docs
    if: github.event_name != 'workflow_dispatch' || inputs.deploy
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
