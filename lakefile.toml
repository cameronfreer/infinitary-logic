name = "InfinitaryLogic"
version = "0.1.0"
keywords = ["math"]
license = "Apache-2.0"
defaultTargets = ["InfinitaryLogic"]
# Deliberate compatibility choice for the TauCeti migration: this package's files are not
# module-system files (`module` header), while upstream Mathlib declares itself designed for the
# module system. Lake would otherwise warn on every such import. This opt-out suppresses exactly
# that warning class (Lake's `allowNonModules`, Lake/Config/LeanConfig.lean at v4.36.0-rc1) and nothing
# else; converting this package to the module system is a separate decision.
allowNonModules = true

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "48fbd05b1dacba016a774a496a054ce6cbcc04c7"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "3d425859e73fcfbef85b9638c2a91708ef4a22d4"

# The infinitary syntax, semantics and index codings (`TauCeti.ModelTheory.Infinitary.*`).
# Pinned to a full revision whose own Mathlib pin is the one below.
[[require]]
name = "TauCeti"
git = "https://github.com/TauCetiProject/TauCeti"
rev = "971a6dd3fade73f7d148d66a289bf9dc75d8b933"

# Mathlib last so its dependency versions take precedence over transitive ones
# (e.g. batteries / Cli pulled in by LeanArchitect, and TauCeti's floating `master`),
# per Mathlib's lake update guidance.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "2e318faecff7d70d4e0cf8cc875104424a737355"

[[lean_lib]]
name = "InfinitaryLogic"

[[lean_lib]]
name = "InfinitaryLogicConditional"
roots = ["InfinitaryLogic.Conditional"]
globs = ["InfinitaryLogic.Conditional.*"]

# Non-default target for the work-in-progress frontier (Skolem towers + EM term model);
# built explicitly in CI so toolchain bumps cannot silently break it.
[[lean_lib]]
name = "InfinitaryLogicWIP"
roots = ["InfinitaryLogic.WIP"]
